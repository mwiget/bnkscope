# Bridge-networking overlay for macOS and WSL2.
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up
#
# `bnkscope up` applies this automatically when it detects Darwin or WSL2. Do
# NOT use it on native Linux: bridge networking there creates iptables rules
# that can drop an SSH session for good when net.bridge.bridge-nf-call-iptables
# is 1, which is the default on most distros.
#
# `network_mode: host` does not do what it says under Docker Desktop — the
# container binds inside the Docker VM, not on the user's machine — so this
# overlay swaps host networking for one bridged network namespace with
# published ports.
#
# ONE namespace, not three. The frontend and the MCP server join the backend's
# with `network_mode: "service:backend"`, so the topology has the same shape as
# the Linux one: everything on a shared loopback, nginx proxying to
# 127.0.0.1:8000. Two consequences follow, and both are load-bearing:
#
#   - Every published port is declared on `backend`, because a service sharing
#     another's namespace cannot publish its own.
#   - Each server binds 0.0.0.0 *inside* the namespace. A published port DNATs
#     to the namespace's interface address, never to its loopback, so a server
#     bound to 127.0.0.1 in here is unreachable from the host.
#
# The alternative — three containers on Docker's default bridge — is what was
# here before, and it could not work: that bridge has no embedded DNS for
# container names, so nginx's `proxy_pass http://backend:8000` failed to
# resolve when it loaded its config and the frontend exited with
# `host not found in upstream "backend"`. Naming no network at all does not
# help either; compose then inherits `network_mode: host` from the base file
# and puts us back inside the VM.
#
# SECURITY: the loopback-only posture is preserved, just enforced one layer up
# — the published addresses below are what decide who can connect, exactly as
# the bind addresses do on Linux. Publishing these as bare "8000:8000" would
# put an unauthenticated API on every interface.

services:
  backend:
    # The one service that names a network, and it has to: without an explicit
    # value here compose inherits `network_mode: host` from the base file and
    # the whole namespace lands inside the VM again. `bridge` is safe for this
    # one because the backend never resolves a container name — it is reached
    # through the published ports below and reaches out through NAT.
    network_mode: bridge
    ports:
      # The API stays loopback-only whatever `--listen` says: nginx is the
      # front door, and it proxies to an API with no authentication.
      - "127.0.0.1:${BNKSCOPE_API_PORT:-8000}:8000"
      # The UI, published on behalf of the frontend below. This honours
      # `--listen` the way the Linux path does; the overlay used to pin
      # 127.0.0.1 here, which made `--listen` a silent no-op on exactly the
      # platforms where the CLI still printed its "reachable from the network"
      # warning.
      - "${BNKSCOPE_UI_BIND:-127.0.0.1}:${BNKSCOPE_UI_PORT:-8080}:8080"
      # And the MCP server, on behalf of the `mcp` profile. Declared
      # unconditionally because a profile cannot add a port; nothing listens
      # here unless that profile is up.
      - "127.0.0.1:${BNKSCOPE_MCP_PORT:-8081}:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # In-container bind. The host-side exposure is the ports mapping above.
      BNKSCOPE_API_HOST: 0.0.0.0
      BNKSCOPE_API_PORT: 8000
      # tmmscope runs on the host, and its discovery file says "localhost" —
      # true for the browser, but not from inside a bridged container. The
      # backend substitutes this host when probing; the URL handed to the
      # browser is left alone.
      BNKSCOPE_TMMSCOPE_PROBE_HOST: host.docker.internal
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/api/system/health"]

  frontend:
    network_mode: "service:backend"
    environment:
      BNKSCOPE_UI_PORT: 8080
      # 0.0.0.0 inside the namespace; the published address above is what
      # actually decides who can reach it.
      BNKSCOPE_UI_BIND: 0.0.0.0
      # Same namespace as the backend, so the same upstream the Linux path
      # uses. The container port is fixed at 8000 regardless of which port the
      # CLI negotiated on the host.
      BNKSCOPE_API_UPSTREAM: 127.0.0.1:8000
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/ || exit 1"]

  mcp:
    network_mode: "service:backend"
    environment:
      BNKSCOPE_API_URL: http://127.0.0.1:8000
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8081"
