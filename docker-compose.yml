# bnkscope — local troubleshooting and monitoring for F5 BNK clusters.
#
# Three services. There is no database server, no broker, no worker pool and no
# reverse proxy, because a single-user tool watching a handful of clusters needs
# none of them: the API is one process holding a SQLite file, a thread pool and
# an APScheduler instance (see backend/core/background.py).
#
#   backend    the API, the WebSocket fan-out, the probes and the periodic jobs
#   frontend   static assets served by nginx
#   mcp        optional — read-only MCP tools for an AI agent (profile: mcp)
#
# SECURITY: bnkscope has no authentication. network_mode: host is used so the
# backend can reach clusters on the host's networks without Docker's bridge
# iptables getting in the way of SSH and VPN routes — which means the bind
# address is the only thing keeping the API off the network. The backend binds
# 127.0.0.1 (see backend/Dockerfile). Do not change that without putting an
# authenticating proxy in front of it.
#
# That bind matters more from Phase 5 on, because the backend now reads your
# kubeconfig and your cloud credentials (the read-only mounts below). Those
# mounts are what let bnkscope find your clusters without being told about
# them, and what let it mint EKS/GKE tokens natively instead of shipping a
# 100 MB AWS CLI. They are also, together with the missing authentication,
# the reason this must never be exposed beyond loopback: anything that can
# reach the API can reach a cluster you can reach.
#
# All three are :ro. bnkscope never writes to your home directory.
#
# Start with `make up`, not `docker compose up`. Docker creates a bind-mount
# source that does not exist — as an empty directory owned by root, inside your
# home. `make up` creates ~/.aws and ~/.config/gcloud as you first, so that
# cannot happen. If you run compose directly and do not have them, either
# mkdir them yourself or delete those two mount lines.

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: api
      args:
        DOCKERHUB_PREFIX: ${BNKSCOPE_DOCKERHUB_PREFIX:-}
    image: bnkscope-api:latest
    container_name: bnkscope-backend
    network_mode: host
    logging: *default-logging
    environment:
      # SQLite lives on the data volume; the schema is created from the ORM
      # models at startup (backend/database.py:init_database).
      DATABASE_URL: sqlite:////app/data/bnkscope.db
      # Loopback only — see the security note above.
      BNKSCOPE_API_HOST: ${BNKSCOPE_API_HOST:-127.0.0.1}
      # Host networking shares the port space with everything else on the box.
      BNKSCOPE_API_PORT: ${BNKSCOPE_API_PORT:-8000}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Encrypts kubeconfigs and cloud credentials at rest. Generated and
      # persisted to the keys volume on first start if unset.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      # Point the cloud SDKs at the read-only mounts below. boto3 and
      # google-auth both resolve credentials from these paths on their own, so
      # naming them here is all it takes for ambient credentials to work.
      AWS_CONFIG_FILE: /host/.aws/config
      AWS_SHARED_CREDENTIALS_FILE: /host/.aws/credentials
      # Null value, not empty string: compose passes AWS_PROFILE through only
      # when the shell has it set. `AWS_PROFILE=""` is not the same as unset —
      # botocore would look for a profile named "" and raise ProfileNotFound.
      AWS_PROFILE:
      GOOGLE_APPLICATION_CREDENTIALS: /host/.config/gcloud/application_default_credentials.json
      # Where the telemetry stack landed (the `telemetry` profile). This is the
      # only way the backend finds it — passed as env rather than by mounting a
      # config directory, since the CLI already knows the negotiated ports at
      # `up` time.
      BNKSCOPE_TELEMETRY: ${BNKSCOPE_TELEMETRY:-off}
      BNKSCOPE_LOKI_URL: http://127.0.0.1:${BNKSCOPE_LOKI_PORT:-3100}
      BNKSCOPE_LOKI_PUSH_URL: http://127.0.0.1:${BNKSCOPE_LOKI_PORT:-3100}/loki/api/v1/push
      BNKSCOPE_PROMETHEUS_PORT: ${BNKSCOPE_PROMETHEUS_PORT:-}
      BNKSCOPE_GRAFANA_PORT: ${BNKSCOPE_GRAFANA_PORT:-}
      # Grafana is published on this address only, so it is also the address
      # the backend has to probe — see tmmscope_service._telemetry_host.
      BNKSCOPE_UI_BIND: ${BNKSCOPE_UI_BIND:-127.0.0.1}
    volumes:
      - bnkscope-data:/app/data
      - bnkscope-keys:/app/keys
      # Read-write here, read-only in Alloy: the backend publishes the
      # collector's config and one kubeconfig per cluster into it.
      - bnkscope-telemetry:/telemetry
      - ./VERSION:/app/VERSION:ro
      # Read-only view of the operator's own credentials. Set BNKSCOPE_HOST_HOME
      # if your kubeconfig lives somewhere other than $HOME.
      #
      # ~/.kube    the cluster list itself — every context here is probed, and
      #            the ones with an F5/BNK namespace register themselves
      # ~/.aws     boto3's own resolution chain reads this to mint EKS tokens
      #            (services/kubernetes/_base.py::_generate_eks_token)
      # ~/.config/gcloud   the same, for GKE, via google-auth
      - ${BNKSCOPE_HOST_HOME:-$HOME}/.kube:/host/.kube:ro
      - ${BNKSCOPE_HOST_HOME:-$HOME}/.aws:/host/.aws:ro
      - ${BNKSCOPE_HOST_HOME:-$HOME}/.config/gcloud:/host/.config/gcloud:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:${BNKSCOPE_API_PORT:-8000}/api/system/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend-v2/Dockerfile
      args:
        DOCKERHUB_PREFIX: ${BNKSCOPE_DOCKERHUB_PREFIX:-}
    image: bnkscope-frontend:latest
    container_name: bnkscope-frontend
    network_mode: host
    logging: *default-logging
    environment:
      # Both ports are settable because host networking shares the port space
      # with everything else on the box.
      BNKSCOPE_UI_PORT: ${BNKSCOPE_UI_PORT:-8080}
      # Loopback unless deliberately widened — nginx proxies /api through to an
      # API with no authentication, so this bind is the real access control,
      # not the backend's. `bnkscope up --listen <addr>` sets it.
      BNKSCOPE_UI_BIND: ${BNKSCOPE_UI_BIND:-127.0.0.1}
      BNKSCOPE_API_UPSTREAM: 127.0.0.1:${BNKSCOPE_API_PORT:-8000}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://${BNKSCOPE_UI_BIND:-127.0.0.1}:${BNKSCOPE_UI_PORT:-8080}/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Read-only MCP tools so an AI agent can query cluster health and read TMM's
  # config. Runs by default; `./bnkscope up --no-mcp` skips it.
  mcp:
    profiles: ["mcp"]
    build:
      context: ./mcp-server
      args:
        DOCKERHUB_PREFIX: ${BNKSCOPE_DOCKERHUB_PREFIX:-}
    image: bnkscope-mcp:latest
    container_name: bnkscope-mcp
    network_mode: host
    logging: *default-logging
    environment:
      BNKSCOPE_API_URL: http://127.0.0.1:8000
      # Explicit: the server defaults to 0.0.0.0, and under host networking
      # nothing else was pinning it.
      MCP_HOST: 127.0.0.1
      MCP_PORT: "8081"
      MCP_LOG_LEVEL: ${MCP_LOG_LEVEL:-INFO}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Optional: the TMM telemetry stack — Prometheus as a remote_write receiver,
  # plus Grafana. Start with `./bnkscope up --telemetry`.
  #
  # Bridge networking, unlike everything above. These two only need to reach
  # each other (Grafana -> prometheus:9090 over the compose network) and to be
  # reachable from the host, and a published port is the honest way to say that:
  # the exporters push to the host gateway from inside your clusters, and the
  # bind address is what decides who else can.
  prometheus:
    profiles: ["telemetry"]
    image: ${BNKSCOPE_DOCKERHUB_PREFIX:-}prom/prometheus:v3.1.0
    container_name: bnkscope-prometheus
    logging: *default-logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # A live window, not a store. A destroyed cluster cleans itself up.
      - --storage.tsdb.retention.time=24h
      # TMM hooks inbound TCP on its dataplane interfaces, so the sidecars
      # cannot be scraped — they push here.
      - --web.enable-remote-write-receiver
      - --web.listen-address=0.0.0.0:9090
    ports:
      # Not loopback-only: the whole point is that pods in your clusters reach
      # it via the host gateway. It receives metrics and serves queries — it
      # holds no credentials and can change nothing.
      - "${BNKSCOPE_PROMETHEUS_PORT:-9491}:9090"
    volumes:
      - ./telemetry/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - bnkscope-prometheus:/prometheus
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  grafana:
    profiles: ["telemetry"]
    image: ${BNKSCOPE_DOCKERHUB_PREFIX:-}grafana/grafana:11.4.0
    container_name: bnkscope-grafana
    logging: *default-logging
    environment:
      GF_SERVER_HTTP_PORT: "3000"
      GF_SERVER_ROOT_URL: "http://localhost:${BNKSCOPE_GRAFANA_PORT:-3000}/"
      # TMM Live embeds the dashboard in an iframe, and an embed that demanded
      # a login would be an embed nobody can read. Anonymous is Viewer only.
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      # Always on. TMM Live embeds the dashboard in an iframe that loads from
      # the operator's browser, so requiring a login here does not protect
      # Grafana — it just puts a login box inside bnkscope's own page, for a
      # dashboard the same person is already looking at.
      #
      # Tying this to the bind was tried and reverted: with --listen the
      # browser *is* remote, so "anonymous only on loopback" means "no embedded
      # dashboard whenever you use it remotely", which is when TMM Live matters
      # most. Anonymous Grafana on a network bind is consistent with the
      # documented posture — that bind has no protection at all, by design and
      # in writing. The admin password below is still generated, because
      # Grafana admin can add a datasource pointing anywhere.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      # Explore — ad-hoc LogQL and PromQL — is an Editor capability by default,
      # so an anonymous Viewer does not merely lack access: Grafana hides the
      # menu, and the feature looks absent rather than forbidden. This grants
      # Viewers that one capability. Nothing is escalated in a tool with no
      # authentication whose boundary is the bind address.
      GF_USERS_VIEWERS_CAN_EDIT: "true"
      GF_USERS_DEFAULT_THEME: "dark"
      # Generated per install by `bnkscope up`. The old default was the
      # literal string "bnkscope", which is in this file, in git, and worked
      # over the network — Grafana admin can add a datasource pointing at the
      # API, which is a way around any gate the UI ever grows.
      GF_SECURITY_ADMIN_PASSWORD: ${BNKSCOPE_GRAFANA_PASSWORD:?run bnkscope up}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      # Follows the UI's bind, and for the same reason. Published wildcard,
      # Grafana's anonymous Viewer plus its datasource proxy is an
      # unauthenticated read gateway into Loki — i.e. every log line from
      # every registered cluster, to anyone on the network, without touching
      # bnkscope at all. Loki being loopback-only does not help: the proxy is
      # on this side of it.
      - "${BNKSCOPE_UI_BIND:-127.0.0.1}:${BNKSCOPE_GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./telemetry/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./telemetry/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - bnkscope-grafana:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Logs, beside the metrics and kept for the same 24h. Loki stays on the
  # bridge with Grafana (which reaches it as loki:3100) and publishes only to
  # loopback — nothing outside this machine queries it.
  loki:
    profiles: ["telemetry"]
    image: ${BNKSCOPE_DOCKERHUB_PREFIX:-}grafana/loki:3.3.2
    container_name: bnkscope-loki
    logging: *default-logging
    command: ["-config.file=/etc/loki/loki.yaml"]
    ports:
      - "127.0.0.1:${BNKSCOPE_LOKI_PORT:-3100}:3100"
    volumes:
      - ./telemetry/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - bnkscope-loki:/loki
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready | grep -q ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # The log collector. Host networking, unlike Loki and Grafana: it dials your
  # clusters' API servers, which is the same reach the backend needs.
  #
  # Its config is generated by the backend into the shared volume below —
  # bnkscope's registered clusters live in its database, and only some of them
  # are in the operator's ~/.kube/config, so a mounted kubeconfig would cover
  # an arbitrary subset and look healthy doing it.
  alloy:
    profiles: ["telemetry"]
    image: ${BNKSCOPE_DOCKERHUB_PREFIX:-}grafana/alloy:v1.18.1
    container_name: bnkscope-alloy
    network_mode: host
    logging: *default-logging
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy
      - /telemetry/config.alloy
    volumes:
      - bnkscope-telemetry:/telemetry:ro
      - bnkscope-alloy:/var/lib/alloy
    depends_on:
      # The config has to exist before Alloy reads it, and the backend is what
      # writes it.
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  # The SQLite database. Back it up from System → Backup, which snapshots the
  # database and the encryption key together — one is useless without the other.
  bnkscope-data:
  # ENCRYPTION_KEY when it is auto-generated rather than supplied.
  bnkscope-keys:
  # The telemetry profile's stores. 24h of TMM counters and logs, plus
  # Grafana's own state and Alloy's read positions.
  bnkscope-prometheus:
  bnkscope-grafana:
  bnkscope-loki:
  bnkscope-alloy:
  # Generated collector config and the per-cluster kubeconfigs it needs.
  # Credentials: written 0600, and this volume is never mounted anywhere else.
  bnkscope-telemetry:
