apiVersion: 1

# Grafana shares the compose network with Loki, so it reaches it by service
# name on the in-container port. The published port (loopback only) is for
# bnkscope's own backend, which is host-networked.
datasources:
  - name: tmm-logs
    uid: tmm-logs
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    jsonData:
      # Correlate a log line with the TMM counters around it: clicking a
      # derived field jumps to the metrics datasource at the same instant.
      maxLines: 5000
    editable: false
