# tmmscope — Prometheus config.
#
# This Prometheus is a RECEIVER, not a scraper: tmm-stat-exporter sidecars in
# each registered cluster push their tmstat metrics here via remote_write
# (TMM hooks inbound TCP on its dataplane interfaces, so the sidecars cannot be
# scraped — they push outbound to this host). Enabled by the
# --web.enable-remote-write-receiver flag in the compose command; short
# retention (--storage.tsdb.retention.time=24h) keeps this a live-monitoring
# window, not a long-term store, and makes cleanup automatic when a cluster is
# destroyed.
global:
  scrape_interval: 15s
  external_labels:
    source: tmmscope
# No scrape_configs here: TMM series arrive via remote_write at /api/v1/write.
#
# Optional site scrape jobs — things on your own network that CAN be scraped,
# such as a DPU's DOCA Telemetry Service or a node-exporter — go in scrape.d/,
# one file per site, each holding a top-level `scrape_configs:` list. The
# directory ships with examples only (*.yml.example); real files are
# git-ignored, and a glob that matches nothing is not an error. After adding or
# changing one: `docker exec bnkscope-prometheus kill -HUP 1`. Not `docker kill
# -s HUP`: that marks the container manually stopped, and Docker then leaves it
# down at the next boot.
scrape_config_files:
  - /etc/prometheus/scrape.d/*.yml
