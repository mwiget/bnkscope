# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  bnkscope — CI                                                              ║
# ║                                                                             ║
# ║  Design: the Makefile is the source of truth. CI does checkout, runtime     ║
# ║  setup, and `make <target>` — so `make pre-push` locally ≡ CI.              ║
# ║                                                                             ║
# ║  Seven jobs, down from 25. The old pipeline split the backend suite across  ║
# ║  five jobs (unit / component / legacy / contract / integration) staged in   ║
# ║  four dependent phases. That made sense when the suite was slow and half    ║
# ║  of it needed a live Postgres. It runs in **12 seconds** now, against       ║
# ║  SQLite, in one process — so five runners each paying ~40s of checkout and  ║
# ║  pip-install to save nothing is the whole cost, and the staging meant a     ║
# ║  typo in an integration test was not reported until three phases in.       ║
# ║                                                                             ║
# ║  One job per toolchain, all in parallel:                                    ║
# ║    lint · typecheck-backend · typecheck-frontend                            ║
# ║    backend-tests · frontend-tests · docker-build · security-audit           ║
# ║                                                                             ║
# ║  Advisory: MCP tests run on mcp/** changes but do not block merge.          ║
# ║  Merge gate: "CI Gate" — configure branch protection to require it.         ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
name: CI

on:
  pull_request:
    branches: [main, staging, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.agent/**'
      - '.opencode/**'
      - 'LICENSE'
      - '.gitignore'
      - '.trivyignore'
      - 'USER_GUIDE.md'
  push:
    # main (deploy trigger) + staging (release-automation preflight needs a
    # push-triggered CI run to match by SHA — see release.yml preflight);
    # develop skipped.
    branches: [main, staging]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.agent/**'
      - '.opencode/**'
      - 'LICENSE'
      - '.gitignore'
      - '.trivyignore'
      - 'USER_GUIDE.md'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  DATABASE_URL: "sqlite:///./test.db"
  SECRET_KEY: "ci-test-secret-key"

jobs:

  # ── Change Detection ──────────────────────────────────────────────────────
  # Single cheap job that determines which paths changed.
  # All other jobs use its outputs to skip irrelevant work.
  changes:
    name: "Detect Changes"
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      mcp: ${{ steps.filter.outputs.mcp }}
      docker: ${{ steps.filter.outputs.docker }}
      scripts: ${{ steps.filter.outputs.scripts }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'requirements*.txt'
              - 'openapi.json'
            frontend:
              - 'frontend-v2/**'
            mcp:
              - 'mcp-server/**'
            docker:
              - 'backend/Dockerfile'
              - 'frontend-v2/Dockerfile'
              - 'docker-compose*.yml'
            scripts:
              - 'scripts/**'
            ci:
              - '.github/workflows/**'
              - 'Makefile'

  # ══════════════════════════════════════════════════════════════════════════
  # PHASE 1: Cheap & Fast (~60s) — Lint + Unit Tests
  # ══════════════════════════════════════════════════════════════════════════

  # ── Lint — both toolchains, one runner ────────────────────────────────────
  lint:
    name: "Lint"
    needs: changes
    if: |
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend-v2/package-lock.json
      - name: Install dependencies
        run: |
          pip install -r backend/requirements-dev.txt
          cd frontend-v2 && npm ci
      - name: Lint backend (ruff)
        run: make lint-backend
      - name: Lint frontend (eslint)
        run: make lint-frontend
      - name: Shell scripts (shellcheck)
        run: make shellcheck

  # ── Types ─────────────────────────────────────────────────────────────────
  typecheck-backend:
    name: "TypeCheck · Backend (mypy)"
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: mypy
        run: make typecheck-backend
      # The committed spec drives the generated TypeScript client. A stale one
      # means the frontend is typed against an API that no longer exists, which
      # tsc cannot catch because both sides agree on the wrong thing.
      - name: OpenAPI spec freshness
        run: make openapi-check
      # The API reference is generated from that spec. The hand-written one it
      # replaced drifted until 288 of its 289 endpoints were gone, and it still
      # told readers the API required authentication — which it does not.
      - name: API reference freshness
        run: make api-docs-check

  typecheck-frontend:
    name: "TypeCheck · Frontend (tsc)"
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend-v2/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend-v2
      - name: tsc
        run: make typecheck-frontend

  # ── Tests ─────────────────────────────────────────────────────────────────
  # One job for the whole backend suite. It was five, staged across four
  # phases; the suite is 12 seconds, so the split cost more in runner setup
  # than it ever saved, and the staging delayed the first failure report.
  backend-tests:
    name: "Tests · Backend"
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: pytest
        run: make test-backend
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-backend
          path: |
            backend/coverage-*.xml
            backend/junit-*.xml
          retention-days: 3
          if-no-files-found: ignore

  frontend-tests:
    name: "Tests · Frontend"
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend-v2/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend-v2
      - name: vitest
        run: make test-frontend
      # `vite build` is a real check: tsc passes on code that Rollup then
      # cannot resolve, and it is what catches a chunk landing back in the
      # initial payload.
      - name: Build
        run: make build-frontend-check

  # ── MCP (advisory — does not block ci-gate) ───────────────────────────────
  mcp-tests:
    name: "MCP Server Tests (advisory)"
    needs: changes
    if: needs.changes.outputs.mcp == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install MCP dependencies
        run: cd mcp-server && pip install -e ".[dev]"
      - name: Run MCP tests
        run: make test-mcp

  # ── Dependency audit ──────────────────────────────────────────────────────
  security-audit:
    name: "Security Audit"
    needs: changes
    if: |
      always() &&
      (needs.changes.outputs.backend == 'true' ||
       needs.changes.outputs.frontend == 'true' ||
       needs.changes.outputs.ci == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend-v2/package-lock.json
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend-v2
      - name: Run security audit
        run: make security-audit

  # ── Images ────────────────────────────────────────────────────────────────
  # No `needs` on the test jobs: an image that will not build is worth knowing
  # about immediately, not after three phases of tests that were going to pass.
  docker-build:
    name: "Docker Build + Scan"
    needs: changes
    if: |
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.docker == 'true' ||
      needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build API image (slim)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: api
          tags: bnkscope-api:latest
          load: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # The images are already built and loaded above, so this costs a few
      # seconds. It exists because settings.VERSION silently fell back to
      # "0.0.0" for the entire life of these images: core/config.py reads
      # /app/VERSION, nothing copied it, and no unit test could ever see that —
      # from a source checkout the same function resolves the repo-root file, so
      # the bug exists ONLY inside an image.
      #
      # It also gates the build wiring itself: a target whose context or
      # dockerfile is wrong cannot build, so it cannot pass this. Two build
      # paths were missed when the context was re-rooted; this is what catches
      # the third.
      - name: Assert VERSION is baked into the backend image
        run: |
          set -euo pipefail
          expected="$(cat VERSION)"
          failed=0
          for img in bnkscope-api; do
            actual="$(docker run --rm --entrypoint "" "$img:latest" cat /app/VERSION 2>/dev/null || echo '')"
            if [ "$actual" = "$expected" ]; then
              echo "  OK    $img reports $actual"
            else
              echo "::error::$img reports '$actual', expected '$expected' — settings.VERSION will fall back to 0.0.0, which surfaces on /api, the OpenAPI title and the X-BNK-Forge-Version header"
              failed=1
            fi
          done
          [ "$failed" -eq 0 ]
      - name: Build Frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend-v2/Dockerfile
          tags: bnkscope-frontend:latest
          load: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      # Slice D / #300: build mcp for Trivy coverage too. The proxy and the
      # operator images went with the subsystems themselves (bnkscope Phases
      # 1 and 2).
      - name: Build MCP image
        uses: docker/build-push-action@v6
        with:
          context: ./mcp-server
          tags: bnkscope-mcp:latest
          load: true
          cache-from: type=gha,scope=mcp
          cache-to: type=gha,mode=max,scope=mcp
      - name: Check image sizes
        run: |
          echo "## Docker Image Sizes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Size | Threshold | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|------|-----------|--------|" >> $GITHUB_STEP_SUMMARY

          check_size() {
            local image=$1 max_mb=$2
            local size_bytes=$(docker image inspect "$image" --format='{{.Size}}')
            local size_mb=$((size_bytes / 1048576))
            if [ "$size_mb" -gt "$max_mb" ]; then
              echo "| $image | ${size_mb}MB | ${max_mb}MB | OVER |" >> $GITHUB_STEP_SUMMARY
              echo "::error::$image is ${size_mb}MB (max: ${max_mb}MB)"
              return 1
            else
              echo "| $image | ${size_mb}MB | ${max_mb}MB | OK |" >> $GITHUB_STEP_SUMMARY
              return 0
            fi
          }

          failed=0
          check_size "bnkscope-api:latest" 700 || failed=1
          check_size "bnkscope-frontend:latest" 150 || failed=1

          if [ "$failed" = "1" ]; then
            echo ""
            echo "::error::One or more images exceed size thresholds"
            exit 1
          fi
          echo ""
          echo "All images within size thresholds" >> $GITHUB_STEP_SUMMARY
      # Slice D / #300: scan all 3 images with the pinned Trivy container (aquasec/trivy:0.62.1).
      # No CLI install step — the container scans the loaded images via the docker socket, which
      # avoids the fragile `curl | sh` installer and pins Trivy by image tag.
      # CRITICAL hard-gates (merge-blocking); HIGH is reported non-blocking — the ~246 HIGH are
      # almost all unfixable Go-stdlib/base CVEs bundled in helm/kubectl/opentofu (see #300).
      - name: "Trivy scan — CRITICAL gate + HIGH report"
        run: |
          docker volume create trivy-cache >/dev/null
          run_trivy() {
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v trivy-cache:/root/.cache/trivy \
              -v "$PWD/.trivyignore:/.trivyignore:ro" \
              aquasec/trivy:0.62.1 image \
              --ignorefile /.trivyignore --scanners vuln --quiet "$@"
          }
          {
            echo "## Trivy findings"
            echo ""
            echo "CRITICAL hard-gates the merge; HIGH is reported, not gated — mostly unfixable"
            echo "Go-stdlib/base CVEs in helm/kubectl/opentofu (see #300)."
            echo ""
            echo "| Image | HIGH |"
            echo "|-------|------|"
          } >> "$GITHUB_STEP_SUMMARY"
          failed=0
          for image in \
            bnkscope-api:latest \
            bnkscope-frontend:latest \
            bnkscope-mcp:latest; do
            echo "::group::Trivy $image"
            # GATE: rely on Trivy's own exit code for CRITICAL — no JSON parsing (Trivy's JSON
            # embeds unescaped control chars in CVE text that break strict parsers).
            if ! run_trivy --severity CRITICAL --exit-code 1 "$image"; then
              echo "::error::Trivy found CRITICAL CVE(s) in $image"
              failed=1
            fi
            # REPORT (non-blocking): dump the HIGH table to the log and count for the summary.
            run_trivy --severity HIGH --exit-code 0 --format table "$image" || true
            high=$(run_trivy --severity HIGH --exit-code 0 --format json "$image" 2>/dev/null \
              | python3 -c "import json,sys; d=json.loads(sys.stdin.read(), strict=False); print(sum(1 for r in (d.get('Results') or []) for v in (r.get('Vulnerabilities') or []) if v.get('Severity')=='HIGH'))" 2>/dev/null \
              || echo "see log")
            echo "| \`$image\` | $high |" >> "$GITHUB_STEP_SUMMARY"
            echo "::endgroup::"
          done
          if [ "$failed" = "1" ]; then
            echo "::error::One or more images have CRITICAL CVEs — blocking merge"
            exit 1
          fi
          echo "CRITICAL gate PASSED — no CRITICAL CVEs across all 3 images"

  # ══════════════════════════════════════════════════════════════════════════
  # CI GATE — The single merge-blocking status check.
  # Configure branch protection to require "CI Gate" to pass.
  # No separate gate jobs — this one job checks all upstream results.
  # ══════════════════════════════════════════════════════════════════════════


  # ══════════════════════════════════════════════════════════════════════════
  # CI GATE — the single merge-blocking status check.
  # Configure branch protection to require "CI Gate".
  # ══════════════════════════════════════════════════════════════════════════
  ci-gate:
    name: "CI Gate"
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - lint
      - typecheck-backend
      - typecheck-frontend
      - backend-tests
      - frontend-tests
      - security-audit
      - docker-build
    steps:
      - name: CI Gate Decision
        run: |
          failed=false
          for job in \
            "lint:${{ needs.lint.result }}" \
            "typecheck-backend:${{ needs.typecheck-backend.result }}" \
            "typecheck-frontend:${{ needs.typecheck-frontend.result }}" \
            "backend-tests:${{ needs.backend-tests.result }}" \
            "frontend-tests:${{ needs.frontend-tests.result }}" \
            "security-audit:${{ needs.security-audit.result }}" \
            "docker-build:${{ needs.docker-build.result }}" \
          ; do
            name="${job%%:*}"
            result="${job##*:}"
            # 'skipped' is acceptable — the path filter decided it was irrelevant.
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::$name: $result"
              failed=true
            else
              echo "$name: $result"
            fi
          done

          if [ "$failed" = "true" ]; then
            echo "::error::CI Gate FAILED"
            exit 1
          fi
          echo "CI Gate PASSED"
