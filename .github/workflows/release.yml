# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  bnkscope — Release Pipeline                                               ║
# ║                                                                             ║
# ║  Trigger: workflow_dispatch ONLY. Releasing is a decision, not a side       ║
# ║  effect of merging.                                                         ║
# ║                                                                             ║
# ║  It used to also fire on every push to main. That is how bnk-forge shipped, ║
# ║  and it surprised us on 2026-08-27: re-pushing the history into a fresh     ║
# ║  repository looked like one enormous push to main and started a release of  ║
# ║  someone else's commits. Dropped deliberately — see ADR D-038.              ║
# ║                                                                             ║
# ║  Version: you choose the bump (patch/minor/major); the tag is derived from  ║
# ║  the VERSION file, not from commit messages.                                ║
# ║                                                                             ║
# ║  Precondition: ci.yml must already have a green run for the exact commit    ║
# ║  you dispatch against. Docs-only commits do not run CI, so a release cannot ║
# ║  be cut directly on top of one — push code, or re-run CI on that SHA.       ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

name: Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch   # 0.1.0 → 0.1.1
          - minor   # 0.1.0 → 0.2.0
          - major   # 0.1.0 → 1.0.0
      release_notes:
        description: "Release notes (one-line summary)"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false  # Never cancel a release in progress

jobs:
  # ── Pre-flight: verify CI passed + derive version ────────────────────────────
  preflight:
    name: "Pre-flight Checks"
    runs-on: ubuntu-latest
    # `actions: read` is load-bearing: the CI-status poll below calls
    # `gh run list`, and this repo's default workflow permission is "read",
    # which grants contents/metadata/packages only -- actions is `none`. The
    # poll's `2>/dev/null || echo ""` then turns the resulting 403 into an
    # empty result, so it reports "No CI run found yet" every 30s for the full
    # 45-minute budget and fails, even though CI passed on that exact SHA.
    permissions:
      contents: read
      actions: read
    outputs:
      current_version: ${{ steps.version.outputs.current }}
      new_version: ${{ steps.version.outputs.new }}
      bump_type: ${{ steps.version.outputs.bump_type }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history + tags needed for conventional-commit derivation

      - name: Check CI status on this branch
        run: |
          BRANCH="${{ github.ref_name }}"
          SHA="${{ github.sha }}"
          echo "Checking CI status for branch '$BRANCH' at commit $SHA"

          # Match the CI run by the exact commit SHA that triggered this
          # release, not by "--limit=1 --branch=X" (which is racy: on main,
          # ci.yml and release.yml fire on the same push so --limit=1 can
          # return this-same-push's still-running CI run; on any other branch,
          # a branch-name lookup can return a stale run from an unrelated
          # earlier push). Matching by SHA is what makes this correct on
          # whatever branch releases from — it needs no per-branch trigger,
          # only that ci.yml runs on that push at all.
          # Budget: last five green CI runs on this repo took ~18 min
          # end-to-end; 2700s (45 min) covers queue delays and future growth.
          TIMEOUT_SECONDS="$CI_POLL_TIMEOUT_SECONDS"
          POLL_INTERVAL=30
          ELAPSED=0

          while true; do
            # stderr is deliberately NOT discarded. It used to be, and a 403
            # from a missing `actions: read` scope was indistinguishable from
            # "the run has not appeared yet" -- 90 identical poll lines and a
            # 45-minute timeout with the real cause never printed once.
            if ! RUN_JSON=$(gh run list \
              --workflow=ci.yml \
              --branch="$BRANCH" \
              --limit=20 \
              --json headSha,status,conclusion,databaseId \
              --jq "[.[] | select(.headSha == \"${SHA}\")] | sort_by(.databaseId) | last"); then
              echo "::error::gh run list failed -- see the error above. This is an" \
                   "API/permissions failure, not a missing run."
              exit 1
            fi

            if [ -z "$RUN_JSON" ] || [ "$RUN_JSON" = "null" ]; then
              echo "[${ELAPSED}s] No CI run found yet for commit $SHA on branch '$BRANCH'"
              # A CI run appears within seconds of the push that created it. If
              # none exists after the grace window, none is coming — waiting the
              # full timeout just to say so wastes 45 minutes. The usual cause is
              # dispatching on top of a docs-only commit: ci.yml's paths-ignore
              # skips those, so the SHA has no run and never will.
              if [ "$ELAPSED" -ge "$NO_RUN_GRACE_SECONDS" ]; then
                echo "::error::No CI run exists for commit $SHA on branch '$BRANCH' after ${ELAPSED}s, and one is not going to appear."
                echo "If HEAD is a docs-only commit, ci.yml did not run for it (paths-ignore). Push a code commit, or re-run CI for this SHA, then dispatch again:"
                echo "  https://github.com/${{ github.repository }}/actions/workflows/ci.yml"
                exit 1
              fi
            else
              RUN_STATUS=$(echo "$RUN_JSON" | jq -r '.status')
              RUN_CONCLUSION=$(echo "$RUN_JSON" | jq -r '.conclusion')
              echo "[${ELAPSED}s] CI run status=$RUN_STATUS conclusion=$RUN_CONCLUSION"

              if [ "$RUN_STATUS" = "completed" ]; then
                if [ "$RUN_CONCLUSION" = "success" ]; then
                  echo "CI has passed for commit $SHA on branch '$BRANCH'"
                  exit 0
                fi
                if [ "$RUN_CONCLUSION" = "cancelled" ]; then
                  # ci.yml runs with cancel-in-progress: true, so a rapid
                  # follow-up push to the same branch cancels this SHA's CI
                  # run. That's not a CI failure for this SHA — it means a
                  # newer push superseded it, so fail fast instead of
                  # reporting a generic non-success error.
                  echo "::error::CI run for $SHA was cancelled — superseded by a newer push; this release attempt is stale, the newer push will release instead."
                  exit 1
                fi
                echo "::error::CI run for commit $SHA on branch '$BRANCH' completed with conclusion '$RUN_CONCLUSION'."
                exit 1
              fi
            fi

            if [ "$ELAPSED" -ge "$TIMEOUT_SECONDS" ]; then
              echo "::error::Timed out after ${TIMEOUT_SECONDS}s waiting for a completed CI run matching commit $SHA on branch '$BRANCH'."
              echo "Re-run this workflow once the CI run for this commit finishes: https://github.com/${{ github.repository }}/actions/workflows/ci.yml"
              exit 1
            fi

            sleep "$POLL_INTERVAL"
            ELAPSED=$((ELAPSED + POLL_INTERVAL))
          done
        env:
          GH_TOKEN: ${{ github.token }}
          CI_POLL_TIMEOUT_SECONDS: 2700
          # Long enough for a queued run to register, short enough that the
          # "there is no run" case fails in minutes rather than in 45.
          NO_RUN_GRACE_SECONDS: 300

      # The bump comes from the dropdown, not from commit messages. Deriving it
      # from conventional commits was the automated path's job, and that path
      # went with the push trigger (D-038), along with the two scripts that
      # implemented it.
      - name: Apply the requested version bump
        id: version
        run: |
          CURRENT=$(cat VERSION)
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "${{ inputs.version_bump }}" in
            major) NEW="$((MAJOR + 1)).0.0" ;;
            minor) NEW="${MAJOR}.$((MINOR + 1)).0" ;;
            patch) NEW="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
            *)     echo "::error::unknown version_bump '${{ inputs.version_bump }}'"; exit 1 ;;
          esac

          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "bump_type=${{ inputs.version_bump }}" >> "$GITHUB_OUTPUT"
          echo "Version: $CURRENT -> $NEW (bump: ${{ inputs.version_bump }})"

      - name: Check the tag doesn't already exist
        run: |
          TAG="v${{ steps.version.outputs.new }}"
          if git tag -l "$TAG" | grep -q "^${TAG}$"; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi
          echo "Tag $TAG is available"

  # ── Manual Release (workflow_dispatch) ───────────────────────────────────────
  release-manual:
    name: "Manual Release v${{ needs.preflight.outputs.new_version }}"
    needs:
      - preflight
    if: needs.preflight.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        run: |
          echo "${{ needs.preflight.outputs.new_version }}" > VERSION
          if git ls-files --error-unmatch dist/VERSION 2>/dev/null; then
            echo "${{ needs.preflight.outputs.new_version }}" > dist/VERSION
          fi

      - name: Update changelog
        env:
          # Same reason as the commit step: a `${{ }}` splice into a shell
          # assignment breaks on a quote and executes on a backtick.
          RELEASE_NOTES: ${{ inputs.release_notes }}
          NEW_VERSION: ${{ needs.preflight.outputs.new_version }}
        run: |
          DATE=$(date +%Y-%m-%d)
          NOTES="$RELEASE_NOTES"

          # See the "Update CHANGELOG.md" step above for why this
          # goes through a temp file + awk instead of an inline sed s-command
          # (release_notes can contain multi-line text or |, &, \).
          ENTRY_FILE=$(mktemp)
          {
            echo "## v${NEW_VERSION} (${DATE})"
            echo ""
            echo "$NOTES"
          } > "$ENTRY_FILE"

          awk -v entry="$ENTRY_FILE" '
            !done && /^---$/ {
              print
              print ""
              while ((getline line < entry) > 0) print line
              done = 1
              next
            }
            { print }
          ' CHANGELOG.md > CHANGELOG.md.new
          mv CHANGELOG.md.new CHANGELOG.md
          rm -f "$ENTRY_FILE"

      - name: Commit and tag
        # Message and tag annotation both go through files, and release_notes
        # arrives as env rather than as `${{ }}` spliced into the script.
        #
        # The old form opened `git commit -m "` and never closed it, so every
        # run died on `unexpected EOF while looking for matching '"'` before it
        # reached the push — release.yml had not cut a release since. The same
        # splice was also an injection: a note containing a quote, a backtick
        # or a `$(` ran as shell in a job with contents: write. The CHANGELOG
        # step above already went to a temp file for exactly this reason.
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
          NEW_VERSION: ${{ needs.preflight.outputs.new_version }}
          PREV_VERSION: ${{ needs.preflight.outputs.current_version }}
          BUMP_TYPE: ${{ inputs.version_bump }}
        run: |
          git add VERSION CHANGELOG.md
          git ls-files --error-unmatch dist/VERSION 2>/dev/null && git add dist/VERSION || true

          MSG_FILE=$(mktemp)
          {
            echo "release: v${NEW_VERSION} [skip ci]"
            echo ""
            echo "${RELEASE_NOTES}"
            echo ""
            echo "Bump: ${BUMP_TYPE}"
            echo "Previous: v${PREV_VERSION}"
            echo "CI: passed"
          } > "$MSG_FILE"
          git commit -F "$MSG_FILE"

          TAG_FILE=$(mktemp)
          {
            echo "Release v${NEW_VERSION}"
            echo ""
            echo "${RELEASE_NOTES}"
          } > "$TAG_FILE"
          git tag -a "v${NEW_VERSION}" -F "$TAG_FILE"

          rm -f "$MSG_FILE" "$TAG_FILE"

      - name: Push
        run: |
          git push origin "${{ github.ref_name }}"
          git push origin "v${{ needs.preflight.outputs.new_version }}"

      - name: Create GitHub Release
        run: |
          gh release create "v${NEW_VERSION}" \
            --title "v${NEW_VERSION}" \
            --notes "$RELEASE_NOTES" \
            --target "${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          NEW_VERSION: ${{ needs.preflight.outputs.new_version }}

      - name: Release summary
        run: |
          echo "## Manual Release v${{ needs.preflight.outputs.new_version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | ${{ needs.preflight.outputs.current_version }} -> ${{ needs.preflight.outputs.new_version }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Bump | ${{ inputs.version_bump }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | ${{ github.ref_name }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| CI | passed |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Notes | ${{ inputs.release_notes }} |" >> "$GITHUB_STEP_SUMMARY"

  # ── Publish images to ghcr (final releases only) ──────────────────────────────
  # Two problems, one job:
  #   1. Until now, release.yml cut a GitHub release but never built/pushed
  #      container images — no ghcr images existed per release.
  #   2. The frontend bakes its displayed version (__APP_VERSION__, from the
  #      root VERSION file) at image-build time. Checking out the just-created
  #      release tag (VERSION already bumped by release-manual)
  #      and building from THIS commit makes the baked UI version equal the
  #      release tag instead of drifting from it.
  # Keyless cosign signing (Sigstore/Fulcio/Rekor via OIDC) needs no secrets
  # beyond the built-in GITHUB_TOKEN: id-token: write mints the OIDC token
  # cosign uses, packages: write lets it push to ghcr.io/<owner-of-this-repo>.
  release-publish:
    name: "Publish images v${{ needs.preflight.outputs.new_version }}"
    needs:
      - preflight
      - release-manual
    if: needs.release-manual.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      # Derived from the repo owner so forks and mirrors publish to their own
      # namespace without editing this workflow.
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      VERSION: ${{ needs.preflight.outputs.new_version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: v${{ needs.preflight.outputs.new_version }}
          fetch-depth: 0

      - name: Resolve release commit
        id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Build and push all images (docker-bake.hcl)
        # `-f docker-bake.hcl` is load-bearing. With no -f, bake also reads
        # docker-compose.yml, and that file requires BNKSCOPE_GRAFANA_PASSWORD
        # (`bnkscope up` generates it) — so bake fails while *parsing*, before
        # it ever looks at a target, and no image is built.
        run: docker buildx bake -f docker-bake.hcl --push default
        env:
          REGISTRY: ${{ env.REGISTRY }}
          VERSION: ${{ env.VERSION }}
          PLATFORMS: linux/amd64,linux/arm64
          # OCI source label tracks whichever remote actually built the image.
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          GIT_REVISION: ${{ steps.rev.outputs.sha }}
          ROLLING_TAG: latest

      - name: Sign, SBOM, and attest all images (keyless cosign)
        run: bash scripts/publish-signed-images.sh --execute
        env:
          # The names publish-signed-images.sh actually requires — it exits 1
          # on a missing BNKSCOPE_REGISTRY.
          BNKSCOPE_REGISTRY: ${{ env.REGISTRY }}
          BNKSCOPE_VERSION: ${{ env.VERSION }}

      - name: Publish summary
        run: |
          echo "## Published images v${{ needs.preflight.outputs.new_version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | Tags |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|------|" >> "$GITHUB_STEP_SUMMARY"
          for name in bnkscope-api bnkscope-frontend bnkscope-mcp bnkscope-tmm-stat-exporter; do
            echo "| ${name} | ${{ env.REGISTRY }}/${name}:${{ needs.preflight.outputs.new_version }}, :latest |" >> "$GITHUB_STEP_SUMMARY"
          done
